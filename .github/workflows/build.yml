name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: |
          ls -la
          FOUND=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "No settings.gradle found in the repository. The project files were not uploaded."
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Building in $DIR"
          gradle build --no-daemon -p "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: paradoxcastle-jar
          path: "**/build/libs/*.jar"
